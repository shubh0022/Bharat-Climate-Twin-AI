<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --color-blue: #3b82f6;
        --color-green: #10b981;
        --color-saffron: #f97316;
      }
    </style>
  </defs>

  <!-- Orbital dot track -->
  <circle cx="50" cy="50" r="42" stroke="#9ca3af" stroke-width="1.5" fill="none" stroke-dasharray="8 8" opacity="0.3" />

  <!-- Spokes -->
  <g transform="rotate(0 50 50)">
    <path d="M 50,14 A 36 36 0 0 1 81,35 C 68,52 57,44 50,50" fill="none" stroke="var(--color-saffron)" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="50" cy="14" r="4.5" fill="var(--color-saffron)" />
  </g>

  <g transform="rotate(120 50 50)">
    <path d="M 50,14 A 36 36 0 0 1 81,35 C 68,52 57,44 50,50" fill="none" stroke="var(--color-green)" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="50" cy="14" r="4.5" fill="var(--color-green)" />
  </g>

  <g transform="rotate(240 50 50)">
    <path d="M 50,14 A 36 36 0 0 1 81,35 C 68,52 57,44 50,50" fill="none" stroke="var(--color-blue)" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="50" cy="14" r="4.5" fill="var(--color-blue)" />
  </g>

  <!-- Core junction -->
  <circle cx="50" cy="50" r="6" fill="#ffffff" />
</svg>
