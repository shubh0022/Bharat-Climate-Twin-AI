<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --color-blue: #002855;
        --color-green: #059669;
        --color-saffron: #ff9933;
        --color-text-main: #0f172a;
        --color-text-sub: #4b5563;
      }
      .brand-spoke-saffron { --spoke-color: var(--color-saffron); }
      .brand-spoke-green { --spoke-color: var(--color-green); }
      .brand-spoke-blue { --spoke-color: var(--color-blue); }
    </style>
  </defs>

  <!-- Instrument crosshair background -->
  <g opacity="0.1">
    <circle cx="30" cy="30" r="28" stroke="var(--color-text-sub)" stroke-width="0.5" fill="none" stroke-dasharray="1 5" />
    <line x1="30" y1="1" x2="30" y2="59" stroke="var(--color-text-sub)" stroke-width="0.5" />
    <line x1="1" y1="30" x2="59" y2="30" stroke="var(--color-text-sub)" stroke-width="0.5" />
  </g>

  <!-- Orbital ring -->
  <circle cx="30" cy="30" r="26" stroke="var(--color-text-sub)" stroke-width="0.75" fill="none" stroke-dasharray="8 8" opacity="0.3" />

  <!-- Spokes -->
  <g class="brand-spoke-saffron">
    <path d="M 30,8 A 22 22 0 0 1 49,21 C 41,31 34,26 30,30" fill="none" stroke="var(--spoke-color)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="30" cy="8" r="2.5" fill="var(--spoke-color)" />
  </g>

  <g class="brand-spoke-green" transform="rotate(120 30 30)">
    <path d="M 30,8 A 22 22 0 0 1 49,21 C 41,31 34,26 30,30" fill="none" stroke="var(--spoke-color)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="30" cy="8" r="2.5" fill="var(--spoke-color)" />
  </g>

  <g class="brand-spoke-blue" transform="rotate(240 30 30)">
    <path d="M 30,8 A 22 22 0 0 1 49,21 C 41,31 34,26 30,30" fill="none" stroke="var(--spoke-color)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="30" cy="8" r="2.5" fill="var(--spoke-color)" />
  </g>

  <!-- Central junction -->
  <circle cx="30" cy="30" r="3.5" fill="var(--color-text-main)" />

  <!-- Wordmark -->
  <text x="65" y="27" font-family="'Inter', -apple-system, sans-serif" font-size="15px" font-weight="800" letter-spacing="0.18em" fill="var(--color-text-main)">BHARAT</text>
  <text x="65" y="44" font-family="'Inter', -apple-system, sans-serif" font-size="9px" font-weight="600" letter-spacing="0.04em" fill="var(--color-text-sub)">CLIMATE TWIN AI</text>
</svg>
