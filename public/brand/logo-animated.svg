<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="100%" height="100%">
  <defs>
    <style>
      /* Colors */
      :root {
        --color-blue: #2563eb;
        --color-green: #10b981;
        --color-saffron: #f97316;
        --color-text-main: #f3f4f6;
        --color-text-sub: #9ca3af;
      }

      /* Spoke properties */
      .brand-spoke-saffron { --spoke-color: var(--color-saffron); --delay: 0.8s; }
      .brand-spoke-green { --spoke-color: var(--color-green); --delay: 1.2s; }
      .brand-spoke-blue { --spoke-color: var(--color-blue); --delay: 1.6s; }

      /* Streamline draw-in effect */
      .streamline {
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: drawStreamline 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        animation-delay: var(--delay);
      }

      /* Neural node scaling */
      .neural-node {
        transform-origin: 30px 30px;
        opacity: 0;
        transform: scale(0);
        animation: scaleNode 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      .neural-node.outer {
        animation-delay: calc(var(--delay) + 0.5s);
      }
      .neural-node.inner {
        animation: scaleNode 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, pulseInner 3s ease-in-out infinite;
        animation-delay: 0.4s, 2.2s;
      }

      /* Satellite orbit path draw-in & rotation */
      .satellite-orbit {
        stroke-dasharray: 280;
        stroke-dashoffset: 280;
        transform-origin: 30px 30px;
        animation: drawOrbit 2s cubic-bezier(0.22, 1, 0.36, 1) forwards, rotateOrbit 20s linear infinite;
        animation-delay: 0.2s;
      }

      /* Text animations */
      .text-main {
        opacity: 0;
        transform: translateX(-10px);
        animation: fadeInText 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        animation-delay: 2.2s;
      }
      .text-sub {
        opacity: 0;
        transform: translateX(-10px);
        animation: fadeInText 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        animation-delay: 2.5s;
      }

      /* Keyframes */
      @keyframes drawStreamline {
        to { stroke-dashoffset: 0; }
      }
      @keyframes scaleNode {
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes drawOrbit {
        to { stroke-dashoffset: 0; }
      }
      @keyframes rotateOrbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes fadeInText {
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes pulseInner {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 1px rgba(255,255,255,0.4)); }
        50% { transform: scale(1.15); filter: drop-shadow(0 0 4px var(--color-blue)); }
      }

      /* Hover States */
      svg:hover .satellite-orbit {
        animation-duration: 6s; /* orbit accelerates */
      }
      svg:hover .neural-node.outer {
        filter: drop-shadow(0 0 5px var(--spoke-color));
      }
      svg:hover .neural-node.inner {
        filter: drop-shadow(0 0 6px var(--color-blue));
      }
    </style>
  </defs>

  <!-- Instrument crosshair background -->
  <g opacity="0.12">
    <circle cx="30" cy="30" r="28" stroke="var(--color-text-sub)" stroke-width="0.5" fill="none" stroke-dasharray="1 5" />
    <line x1="30" y1="1" x2="30" y2="59" stroke="var(--color-text-sub)" stroke-width="0.5" />
    <line x1="1" y1="30" x2="59" y2="30" stroke="var(--color-text-sub)" stroke-width="0.5" />
  </g>

  <!-- Rotating Satellite Orbit -->
  <g class="satellite-orbit">
    <circle cx="30" cy="30" r="26" stroke="var(--color-text-sub)" stroke-width="0.75" fill="none" stroke-dasharray="30 130" opacity="0.4" />
    <circle cx="30" cy="4" r="1.5" fill="var(--color-saffron)" />
  </g>

  <!-- Spokes -->
  <g class="brand-spoke-saffron">
    <path class="streamline" d="M 30,8 A 22 22 0 0 1 49,21 C 41,31 34,26 30,30" fill="none" stroke="var(--spoke-color)" stroke-width="2.5" stroke-linecap="round" />
    <circle class="neural-node outer" cx="30" cy="8" r="2.5" fill="var(--spoke-color)" />
  </g>

  <g class="brand-spoke-green" transform="rotate(120 30 30)">
    <path class="streamline" d="M 30,8 A 22 22 0 0 1 49,21 C 41,31 34,26 30,30" fill="none" stroke="var(--spoke-color)" stroke-width="2.5" stroke-linecap="round" />
    <circle class="neural-node outer" cx="30" cy="8" r="2.5" fill="var(--spoke-color)" />
  </g>

  <g class="brand-spoke-blue" transform="rotate(240 30 30)">
    <path class="streamline" d="M 30,8 A 22 22 0 0 1 49,21 C 41,31 34,26 30,30" fill="none" stroke="var(--spoke-color)" stroke-width="2.5" stroke-linecap="round" />
    <circle class="neural-node outer" cx="30" cy="8" r="2.5" fill="var(--spoke-color)" />
  </g>

  <!-- Central junction node -->
  <circle class="neural-node inner" cx="30" cy="30" r="3.5" fill="var(--color-text-main)" />

  <!-- Typography -->
  <text class="text-main" x="65" y="27" font-family="'Inter', -apple-system, sans-serif" font-size="15px" font-weight="800" letter-spacing="0.18em" fill="var(--color-text-main)">BHARAT</text>
  <text class="text-sub" x="65" y="44" font-family="'Inter', -apple-system, sans-serif" font-size="9px" font-weight="600" letter-spacing="0.04em" fill="var(--color-text-sub)">CLIMATE TWIN AI</text>
</svg>
